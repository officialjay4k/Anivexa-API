<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Anivexa — Markers + Fallback Test Bench</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.7/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer@5.4.0/dist/artplayer.js"></script>
    <script src="https://flixcloud.cc/artplayer-new/artplayer-plugin-libass.legacy.js?v=104"></script>

    <style>
      body {
        background: #121212;
        color: #fff;
        font-family: sans-serif;
        padding: 20px;
        margin: 0;
      }
      input,
      select,
      button {
        padding: 10px;
        font-size: 15px;
        margin-right: 5px;
        margin-bottom: 10px;
      }
      input,
      select {
        background: #222;
        border: 1px solid #444;
        color: #fff;
        border-radius: 4px;
      }
      input[type='text'] {
        width: 200px;
      }
      .btn-primary {
        background: #6200ee;
        color: #fff;
        border: none;
        cursor: pointer;
        border-radius: 4px;
        font-weight: bold;
      }
      .btn-primary:hover {
        background: #7c4dff;
      }
      .btn-warn {
        background: #d97706;
        color: #fff;
        border: none;
        cursor: pointer;
        border-radius: 4px;
        font-weight: bold;
      }
      .btn-warn:hover {
        background: #f59e0b;
      }
      .results {
        margin-top: 20px;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }
      .list {
        flex: 1;
        min-width: 300px;
        background: #1e1e1e;
        padding: 15px;
        border-radius: 8px;
        max-height: 640px;
        overflow-y: auto;
      }
      .player-container {
        flex: 1;
        min-width: 360px;
        background: #1e1e1e;
        padding: 15px;
        border-radius: 8px;
      }
      .artplayer-app {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #333;
        position: relative;
      }
      .artplayer-app iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      .mode-badge {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 100;
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 0.3px;
      }
      .mode-badge.player {
        background: #6200ee;
      }
      .mode-badge.iframe {
        background: #d97706;
      }
      pre {
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 12px;
        color: #00ffcc;
      }
      p {
        margin: 6px 0;
        font-size: 13px;
        line-height: 1.4;
      }
      .search-section {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 20px;
      }
      .search-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .search-input {
        flex: 1;
        min-width: 240px;
        padding: 12px 14px;
        font-size: 15px;
        background: #222;
        border: 1px solid #333;
        color: #fff;
        border-radius: 8px;
        outline: none;
      }
      .search-input:focus {
        border-color: #6200ee;
      }
      .search-status {
        font-size: 12px;
        color: #888;
        margin: 8px 0 0 2px;
      }
      .results-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
        margin-top: 14px;
      }
      .anime-card {
        background: #222;
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
        border: 1px solid transparent;
      }
      .anime-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(98, 0, 238, 0.35);
        border-color: #6200ee;
      }
      .anime-card img {
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        display: block;
        background: #111;
      }
      .anime-card .card-meta {
        padding: 8px 10px 10px;
      }
      .anime-card .card-title {
        font-size: 12px;
        line-height: 1.3;
        margin: 0;
        height: 2.6em;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .anime-card .card-sub {
        font-size: 11px;
        color: #999;
        margin-top: 4px;
      }
      .anime-card.selected {
        border-color: #6200ee;
        box-shadow: 0 0 0 1px #6200ee;
      }
    </style>
  </head>
  <body>
    <h1>Anivexa — Markers + Fallback Test Bench</h1>

    <div class="search-section">
      <div class="search-row">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search anime by title (leave empty for trending)…"
          autocomplete="off"
        />
      </div>
      <div class="search-status" id="searchStatus">Loading trending…</div>
      <div class="results-grid" id="resultsGrid"></div>
    </div>

    <div>
      <input
        type="text"
        id="anilistInput"
        placeholder="AniList ID"
        value="16498"
      />
      <select id="providerSelect">
        <option value="reanime">Reanime</option>
        <option value="mkissa">MKissa</option>
        <option value="senshi">Senshi</option>
        <option value="anizone">AniZone</option>
        <option value="kaa">KickAssAnime</option>
      </select>
      <button class="btn-primary" onclick="runPipeline()">
        Fetch & Play Ep 1
      </button>
      <button class="btn-warn" onclick="testFallback()">Force Fallback</button>
      <button
        class="btn-primary"
        onclick="document.getElementById('resultsList').innerHTML=''"
      >
        Clear Log
      </button>
    </div>

    <div class="results">
      <div class="list" id="resultsList">
        <p>Pipeline logs will appear here...</p>
      </div>
      <div class="player-container">
        <h3>Player Sandbox</h3>
        <div class="artplayer-app" id="artplayer-app">
          <div class="mode-badge player" id="modeBadge">PLAYER MODE</div>
        </div>
        <p
          id="streamInfo"
          style="margin-top: 10px; font-weight: bold; color: #bb86fc"
        ></p>
      </div>
    </div>

    <script>
      let currentMode = 'player';
      let art = null;
      let hlsInstance = null;
      let currentSkipIntervals = { op: null, ed: null };
      let skipBtnEl = null;
      let skipFired = { op: false, ed: false };
      let lastWatchData = null;
      let hlsRecoveryAttempts = 0;
      const HLS_MAX_RECOVERY_ATTEMPTS = 3;

      const SETTINGS_KEY = '4kun_settings';
      const DEFAULT_SETTINGS = {
        autoSkip: false,
        skipButtonVisible: true,
        progressMarkersVisible: true,
      };

      function loadSettings() {
        try {
          const raw = localStorage.getItem(SETTINGS_KEY);
          if (!raw) return { ...DEFAULT_SETTINGS };
          return { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
        } catch {
          return { ...DEFAULT_SETTINGS };
        }
      }
      function saveSettings(s) {
        try {
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
        } catch (err) {
          console.warn('[Settings] save failed:', err);
        }
      }
      let appSettings = loadSettings();

      const ANILIST_GRAPHQL = 'https://graphql.anilist.co';

      const SEARCH_QUERY = `
        query ($search: String, $sort: [MediaSort]) {
          Page(page: 1, perPage: 20) {
            media(search: $search, type: ANIME, sort: $sort) {
              id idMal
              title { romaji english }
              coverImage { large }
              episodes format averageScore seasonYear
            }
          }
        }
      `;

      const searchInputEl = document.getElementById('searchInput');
      const searchStatusEl = document.getElementById('searchStatus');
      const resultsGridEl = document.getElementById('resultsGrid');

      let lastSearchToken = 0;
      const searchCache = new Map();

      function setSearchStatus(text, isError = false) {
        searchStatusEl.textContent = text;
        searchStatusEl.style.color = isError ? '#ff6b6b' : '#888';
      }

      function renderResults(mediaList) {
        resultsGridEl.innerHTML = '';
        if (!mediaList || mediaList.length === 0) {
          resultsGridEl.innerHTML =
            '<p style="color:#888;grid-column:1/-1;">No results.</p>';
          return;
        }
        mediaList.forEach((media) => {
          const card = document.createElement('div');
          card.className = 'anime-card';
          card.dataset.anilistId = media.id;
          card.dataset.title = media.title.english || media.title.romaji || '';

          const img = document.createElement('img');
          img.loading = 'lazy';
          img.alt = card.dataset.title;
          img.src = media.coverImage?.large || '';
          img.onerror = () => {
            img.style.display = 'none';
          };

          const meta = document.createElement('div');
          meta.className = 'card-meta';

          const titleEl = document.createElement('p');
          titleEl.className = 'card-title';
          titleEl.textContent = card.dataset.title;

          const subEl = document.createElement('div');
          subEl.className = 'card-sub';
          const bits = [];
          if (media.format) bits.push(media.format);
          if (media.seasonYear) bits.push(media.seasonYear);
          if (media.episodes) bits.push(`${media.episodes} ep`);
          if (media.averageScore) bits.push(`${media.averageScore}%`);
          subEl.textContent = bits.join(' · ');

          meta.appendChild(titleEl);
          meta.appendChild(subEl);
          card.appendChild(img);
          card.appendChild(meta);

          card.addEventListener('click', () => {
            document.getElementById('anilistInput').value = media.id;
            resultsGridEl
              .querySelectorAll('.anime-card.selected')
              .forEach((el) => el.classList.remove('selected'));
            card.classList.add('selected');
            setSearchStatus(
              `Selected: ${card.dataset.title} (AniList ${media.id})`
            );
          });

          resultsGridEl.appendChild(card);
        });
      }

      async function fetchFromAniList(searchTerm) {
        const cacheKey = searchTerm.toLowerCase().trim() || '__trending__';
        if (searchCache.has(cacheKey)) return searchCache.get(cacheKey);

        const body = {
          query: SEARCH_QUERY,
          variables: searchTerm
            ? { search: searchTerm, sort: ['POPULARITY_DESC'] }
            : { search: null, sort: ['TRENDING_DESC'] },
        };
        const res = await fetch(ANILIST_GRAPHQL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Accept: 'application/json',
          },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error(`AniList HTTP ${res.status}`);
        const json = await res.json();
        const list = json?.data?.Page?.media || [];
        searchCache.set(cacheKey, list);
        return list;
      }

      async function performSearch(term) {
        const myToken = ++lastSearchToken;
        const isTrending = !term;
        setSearchStatus(
          isTrending ? 'Loading trending…' : `Searching "${term}"…`
        );
        try {
          const list = await fetchFromAniList(term);
          if (myToken !== lastSearchToken) return;
          renderResults(list);
          setSearchStatus(
            isTrending
              ? `Trending now (${list.length})`
              : `${list.length} results for "${term}"`
          );
        } catch (err) {
          if (myToken !== lastSearchToken) return;
          setSearchStatus(`Search failed: ${err.message}`, true);
        }
      }
      function debounce(fn, ms) {
        let t;
        return (...args) => {
          clearTimeout(t);
          t = setTimeout(() => fn(...args), ms);
        };
      }
      searchInputEl.addEventListener(
        'input',
        debounce((e) => performSearch(e.target.value.trim()), 250)
      );
      performSearch('');

      const API_BASE = 'https://anivexa-api-production-46c4.up.railway.app';
      const FALLBACK_FONT_URL =
        'https://cdn.jsdelivr.net/fontsource/fonts/roboto@latest/latin-400-normal.woff2';
      const listDiv = document.getElementById('resultsList');

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }
      function formatTime(seconds) {
        if (isNaN(seconds) || !seconds) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      }
      function log(html, color) {
        const p = document.createElement('p');
        if (color) p.style.color = color;
        p.innerHTML = html;
        listDiv.appendChild(p);
        listDiv.scrollTop = listDiv.scrollHeight;
      }

      function setMode(mode) {
        currentMode = mode;
        const badge = document.getElementById('modeBadge');
        if (badge) {
          badge.className = `mode-badge ${mode}`;
          badge.textContent =
            mode === 'player' ? 'PLAYER MODE' : 'IFRAME FALLBACK';
        }
        log(
          `[Mode] → <b>${mode.toUpperCase()}</b>`,
          mode === 'player' ? '#00ffcc' : '#f59e0b'
        );
      }

      // ============================================================
      // IMPROVED SKIP RESOLUTION — reads ALL possible sources
      // ============================================================
      function extractInterval(startVal, endVal) {
        const s = Number(startVal);
        const e = Number(endVal);
        if (!isFinite(s) || !isFinite(e) || e <= s) return null;
        return { startTime: s, endTime: e };
      }

      function normalizeIntroOutro(obj) {
        // Accepts { start, end } or { startTime, endTime } or null
        if (!obj || typeof obj !== 'object') return null;
        const s = obj.start ?? obj.startTime;
        const e = obj.end ?? obj.endTime;
        return extractInterval(s, e);
      }

      async function resolveSkipIntervals(anilistId, epNum, watchData) {
        const streams = watchData?.streams || [];
        const s0 = streams[0] || {};

        const sources = [];

        // Source A: streams[0].intro / .outro (object shape)
        if (s0.intro)
          sources.push({
            name: 'streams[0].intro',
            op: normalizeIntroOutro(s0.intro),
            ed: normalizeIntroOutro(s0.outro),
          });

        // Source B: top-level intro / outro (object shape)
        if (watchData?.intro || watchData?.outro)
          sources.push({
            name: 'payload.intro/outro',
            op: normalizeIntroOutro(watchData.intro),
            ed: normalizeIntroOutro(watchData.outro),
          });

        // Source C: top-level raw numbers intro_start / intro_end / etc
        if (
          watchData?.intro_start != null ||
          watchData?.intro_end != null ||
          watchData?.outro_start != null ||
          watchData?.outro_end != null
        ) {
          sources.push({
            name: 'payload.intro_start/intro_end',
            op: extractInterval(watchData.intro_start, watchData.intro_end),
            ed: extractInterval(watchData.outro_start, watchData.outro_end),
          });
        }

        // Source D: chapters[] with title "opening" or "ending"
        const chapters = watchData?.chapters || s0.chapters || [];
        if (chapters.length > 0) {
          const findChapter = (needle) =>
            chapters.find((c) =>
              (c.title || '').toLowerCase().includes(needle)
            );
          const opc = findChapter('opening') || findChapter('op');
          const edc = findChapter('ending') || findChapter('ed');
          if (opc || edc) {
            sources.push({
              name: 'chapters[]',
              op: opc ? extractInterval(opc.start, opc.end) : null,
              ed: edc ? extractInterval(edc.start, edc.end) : null,
            });
          }
        }

        // Log every source we found
        if (sources.length === 0) {
          log(`[Resolve] No payload sources for intro/outro.`, 'orange');
        } else {
          sources.forEach((s) => {
            const opTxt = s.op
              ? `${formatTime(s.op.startTime)}–${formatTime(s.op.endTime)}`
              : 'none';
            const edTxt = s.ed
              ? `${formatTime(s.ed.startTime)}–${formatTime(s.ed.endTime)}`
              : 'none';
            log(
              `[Resolve] source <b>${s.name}</b> → intro: ${opTxt} · outro: ${edTxt}`,
              '#aaa'
            );
          });
        }

        // Pick the first source that has at least one non-null interval
        const winner = sources.find((s) => s.op || s.ed);
        if (winner) {
          log(`[Resolve] <b>Using: ${winner.name}</b>`, '#00ffcc');
          return {
            op: winner.op,
            ed: winner.ed,
            source: winner.name,
          };
        }

        // Fallback to AniSkip
        log(`[Resolve] Falling back to AniSkip…`, 'orange');
        return await fetchAniSkipIntervals(anilistId, epNum);
      }

      async function getMalIdFromAniList(anilistId) {
        try {
          const res = await fetch(ANILIST_GRAPHQL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json',
            },
            body: JSON.stringify({
              query: `query ($id: Int) { Media (id: $id, type: ANIME) { idMal } }`,
              variables: { id: parseInt(anilistId) },
            }),
          });
          const json = await res.json();
          return json?.data?.Media?.idMal || anilistId;
        } catch {
          return anilistId;
        }
      }

      async function fetchAniSkipIntervals(anilistId, epNum = 1) {
        try {
          const malId = await getMalIdFromAniList(anilistId);
          log(`[AniSkip] MAL ID: <b>${malId}</b>`, '#00ffcc');
          const res = await fetch(
            `https://api.aniskip.com/v2/skip-times/${malId}/${epNum}?types=op&types=ed&episodeLength=0`
          );
          if (!res.ok) {
            log(`[AniSkip] No data (HTTP ${res.status}).`, '#aaa');
            return null;
          }
          const data = await res.json();
          if (data && data.found) {
            const op = data.results?.find((r) => r.skipType === 'op')?.interval;
            const ed = data.results?.find((r) => r.skipType === 'ed')?.interval;
            if (op || ed) {
              log(
                `[AniSkip] found ${op ? 'intro' : ''}${op && ed ? ' + ' : ''}${
                  ed ? 'outro' : ''
                }`,
                '#00ffcc'
              );
              return {
                op: op
                  ? { startTime: op.startTime, endTime: op.endTime }
                  : null,
                ed: ed
                  ? { startTime: ed.startTime, endTime: ed.endTime }
                  : null,
                source: 'aniskip',
              };
            }
          }
          log(`[AniSkip] No crowdsourced data for this episode.`, '#aaa');
        } catch (err) {
          log(`[AniSkip] ${escapeHtml(err.message)}`, '#aaa');
        }
        return null;
      }

      function pickBestEmbed(watchData) {
        const embeds = watchData?.embeds || [];
        if (!embeds.length) return null;
        const priority = { 'HD-2': 0, 'HD-1': 1 };
        const sorted = embeds
          .slice()
          .sort((a, b) => (priority[a.name] ?? 9) - (priority[b.name] ?? 9));
        return sorted[0];
      }

      function appendStartTime(embedUrl, seconds) {
        if (!seconds || seconds < 1) return embedUrl;
        try {
          const u = new URL(embedUrl);
          if (
            u.searchParams.has('start_at') ||
            u.searchParams.has('t') ||
            u.searchParams.has('start')
          )
            return embedUrl;
          u.searchParams.set('start_at', String(Math.floor(seconds)));
          return u.toString();
        } catch {
          return embedUrl;
        }
      }

      function unmountPlayer() {
        if (hlsInstance) {
          try {
            hlsInstance.destroy();
          } catch {}
          hlsInstance = null;
        }
        if (art) {
          try {
            art.destroy(true);
          } catch {}
          art = null;
        }
        skipBtnEl = null;
      }

      function mountIframe(embedUrl) {
        const container = document.getElementById('artplayer-app');
        container.innerHTML = '';
        const badge = document.createElement('div');
        badge.className = 'mode-badge iframe';
        badge.id = 'modeBadge';
        badge.textContent = 'IFRAME FALLBACK';
        container.appendChild(badge);

        const iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        iframe.setAttribute(
          'allow',
          'autoplay; encrypted-media; picture-in-picture; fullscreen'
        );
        iframe.setAttribute('allowfullscreen', 'true');
        iframe.setAttribute('referrerpolicy', 'origin');
        container.appendChild(iframe);
      }

      async function switchToIframe(reason) {
        if (currentMode === 'iframe') {
          log(`[Fallback] Already in iframe.`, 'orange');
          return;
        }
        if (!lastWatchData) {
          log(`[Fallback] No watch data cached.`, 'red');
          return;
        }
        log(`[Fallback] Triggered: <b>${reason}</b>`, '#f59e0b');

        let startSeconds = 0;
        if (art?.video) {
          try {
            startSeconds = art.video.currentTime || 0;
          } catch {}
        }
        log(
          `[Fallback] Preserving time: ${formatTime(startSeconds)}`,
          '#f59e0b'
        );

        const best = pickBestEmbed(lastWatchData);
        if (!best || !best.url) {
          log(`[Fallback] No embed URL — cannot fallback.`, 'red');
          return;
        }
        log(`[Fallback] Server: <b>${best.name}</b> (${best.type})`, '#f59e0b');

        const finalUrl = appendStartTime(best.url, startSeconds);
        unmountPlayer();
        mountIframe(finalUrl);
        setMode('iframe');
        skipFired = { op: false, ed: false };
        currentSkipIntervals = { op: null, ed: null };
      }

      function testFallback() {
        if (!lastWatchData) {
          log(`[Fallback] Run the pipeline first.`, 'orange');
          return;
        }
        switchToIframe('manual test button');
      }

      async function fetchAsBlobUrl(
        proxyUrl,
        { expectWasm = false, mimeType = 'application/javascript' } = {}
      ) {
        const resp = await fetch(proxyUrl);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const buf = await resp.arrayBuffer();
        if (expectWasm) {
          const head = new Uint8Array(buf.slice(0, 8));
          const isWasm =
            head[0] === 0x00 &&
            head[1] === 0x61 &&
            head[2] === 0x73 &&
            head[3] === 0x6d;
          if (!isWasm) throw new Error(`Not WASM`);
        }
        return URL.createObjectURL(new Blob([buf], { type: mimeType }));
      }

      function proxySubtitle(url) {
        return `${API_BASE}/proxy/subtitle?url=${encodeURIComponent(url)}`;
      }
      function proxyReanimeStatic(p) {
        return `${API_BASE}/proxy/reanime-static?path=${encodeURIComponent(p)}`;
      }

      function detectSubtitleType(sub) {
        const fmt = (sub.format || '').toLowerCase();
        if (fmt === 'ass' || fmt === 'ssa') return 'ass';
        if (fmt === 'srt') return 'srt';
        if (fmt === 'vtt' || fmt === 'webvtt') return 'vtt';
        const m = (sub.url || '').toLowerCase().match(/\.([a-z0-9]+)(?:\?|$)/);
        if (m && (m[1] === 'ass' || m[1] === 'ssa')) return 'ass';
        if (m && m[1] === 'srt') return 'srt';
        if (m && m[1] === 'vtt') return 'vtt';
        return 'unknown';
      }

      function buildSubtitleSelector(subs) {
        const items = [{ html: 'Off', url: null, default: false }];
        subs.forEach((sub, i) => {
          const kind = detectSubtitleType(sub);
          items.push({
            html: sub.language || `Track ${i}`,
            url: proxySubtitle(sub.url),
            type: kind,
            name: sub.language || `Track ${i}`,
            format: kind,
            default: !!sub.default,
          });
        });
        return items;
      }

      async function loadSubtitle(item) {
        if (!item || !item.url) {
          art.subtitle.show = false;
          if (art.plugins.artplayerPluginLibass) {
            try {
              art.plugins.artplayerPluginLibass.hide();
            } catch {}
          }
          log(`[Subs] OFF`, '#aaa');
          return;
        }
        log(`[Subs] → <b>${item.html}</b> (${item.format})`, '#00ffcc');
        if (item.format === 'ass') {
          const libass = art.plugins?.artplayerPluginLibass;
          if (!libass) {
            log(`[Subs] libass not loaded`, 'red');
            return;
          }
          try {
            await libass.switch(item.url);
            libass.show();
            art.subtitle.show = true;
            log(`[Subs] libass switched`, '#00ffcc');
          } catch (err) {
            log(`[Subs] libass error: ${escapeHtml(err.message)}`, 'red');
          }
          return;
        }
        if (item.format === 'srt' || item.format === 'vtt') {
          try {
            const res = await fetch(item.url);
            const text = await res.text();
            let vtt = text;
            if (item.format === 'srt') {
              vtt =
                'WEBVTT\n\n' +
                text
                  .replace(/\r+/g, '')
                  .replace(/^\d+\s*$/gm, '')
                  .replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2')
                  .replace(/\n{3,}/g, '\n\n');
            }
            const blobUrl = URL.createObjectURL(
              new Blob([vtt], { type: 'text/vtt' })
            );
            if (art.plugins.artplayerPluginLibass) {
              try {
                art.plugins.artplayerPluginLibass.hide();
              } catch {}
            }
            art.subtitle.switch(blobUrl, {
              type: 'vtt',
              encoding: 'utf-8',
              escape: false,
              name: item.name,
            });
            art.subtitle.show = true;
            log(`[Subs] native VTT attached`, '#00ffcc');
          } catch (err) {
            log(`[Subs] native error: ${escapeHtml(err.message)}`, 'red');
          }
        }
      }

      function mountSkipButton() {
        const player = art?.template?.$player;
        if (!player) return;
        const old = player.querySelector('.custom-skip-button');
        if (old) old.remove();

        const btn = document.createElement('button');
        btn.className = 'custom-skip-button';
        btn.type = 'button';
        btn.innerText = 'Skip Intro ➔';
        Object.assign(btn.style, {
          position: 'absolute',
          bottom: '90px',
          right: '24px',
          zIndex: '80',
          background: '#ff8c00',
          color: '#fff',
          padding: '10px 18px',
          border: 'none',
          borderRadius: '6px',
          fontWeight: 'bold',
          fontSize: '14px',
          cursor: 'pointer',
          boxShadow: '0 4px 14px rgba(0,0,0,0.85)',
          display: 'none',
        });
        player.appendChild(btn);
        skipBtnEl = btn;
      }

      function updateSkipButton() {
        if (currentMode !== 'player') return;
        if (!art?.video) return;
        const t = art.video.currentTime;
        const inOp =
          currentSkipIntervals.op &&
          t >= currentSkipIntervals.op.startTime &&
          t < currentSkipIntervals.op.endTime;
        const inEd =
          currentSkipIntervals.ed &&
          t >= currentSkipIntervals.ed.startTime &&
          t < currentSkipIntervals.ed.endTime;

        if (!inOp && !inEd) {
          if (skipBtnEl) skipBtnEl.style.display = 'none';
          skipFired.op = false;
          skipFired.ed = false;
          return;
        }
        const interval = inOp
          ? currentSkipIntervals.op
          : currentSkipIntervals.ed;
        const label = inOp ? 'Intro' : 'Outro';
        const key = inOp ? 'op' : 'ed';

        if (appSettings.autoSkip) {
          if (!skipFired[key]) {
            skipFired[key] = true;
            art.currentTime = interval.endTime;
            log(
              `[Auto-Skip] Skipped ${label} → ${formatTime(interval.endTime)}`,
              '#00ffcc'
            );
          }
          if (skipBtnEl) skipBtnEl.style.display = 'none';
          return;
        }

        if (!appSettings.skipButtonVisible) {
          if (skipBtnEl) skipBtnEl.style.display = 'none';
          return;
        }
        if (skipBtnEl) {
          skipBtnEl.innerText = `Skip ${label} ➔`;
          skipBtnEl.style.display = 'block';
          skipBtnEl.onclick = (e) => {
            e.stopPropagation();
            art.currentTime = interval.endTime;
            log(
              `[Skip] Clicked ${label} → ${formatTime(interval.endTime)}`,
              '#00ffcc'
            );
          };
        }
      }

      function mountProgressMarkers() {
        if (currentMode !== 'player') return;
        if (!art?.template?.$progress) return;
        const inner = art.template.$progress.querySelector(
          '.art-control-progress-inner'
        );
        if (!inner) return;
        inner
          .querySelectorAll('.custom-skip-marker')
          .forEach((el) => el.remove());
        if (!appSettings.progressMarkersVisible) return;
        if (!art.duration || !isFinite(art.duration)) return;

        const addMarker = (interval, label) => {
          if (!interval) return;
          const start = Math.max(0, interval.startTime);
          const end = Math.min(art.duration, interval.endTime);
          if (end <= start) return;
          const left = (start / art.duration) * 100;
          const width = ((end - start) / art.duration) * 100;
          const m = document.createElement('div');
          m.className = 'custom-skip-marker';
          m.title = label;
          Object.assign(m.style, {
            position: 'absolute',
            left: `${left}%`,
            width: `${width}%`,
            top: '0',
            height: '100%',
            background: 'linear-gradient(90deg, #ff8c00, #ffa500)',
            opacity: '0.85',
            borderRadius: '2px',
            pointerEvents: 'none',
            zIndex: '25',
          });
          inner.appendChild(m);
          log(
            `[Markers] ${label}: ${left.toFixed(1)}% → ${(left + width).toFixed(
              1
            )}%`,
            '#00ffcc'
          );
        };
        addMarker(currentSkipIntervals.op, 'Intro');
        addMarker(currentSkipIntervals.ed, 'Outro');
      }

      function buildSettingsMenu() {
        const iconSkip =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>';
        const iconEye =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        const iconBar =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>';

        return [
          {
            name: 'auto-skip',
            html: 'Auto Skip Intro/Outro',
            icon: iconSkip,
            tooltip: appSettings.autoSkip ? 'On' : 'Off',
            switch: appSettings.autoSkip,
            onSwitch: async function (item) {
              const ns = !item.switch;
              appSettings.autoSkip = ns;
              saveSettings(appSettings);
              item.tooltip = ns ? 'On' : 'Off';
              return ns;
            },
          },
          {
            name: 'skip-button-visible',
            html: 'Show Skip Button',
            icon: iconEye,
            tooltip: appSettings.skipButtonVisible ? 'On' : 'Off',
            switch: appSettings.skipButtonVisible,
            onSwitch: async function (item) {
              const ns = !item.switch;
              appSettings.skipButtonVisible = ns;
              saveSettings(appSettings);
              item.tooltip = ns ? 'On' : 'Off';
              if (!ns && skipBtnEl) skipBtnEl.style.display = 'none';
              return ns;
            },
          },
          {
            name: 'markers-visible',
            html: 'Show Progress Markers',
            icon: iconBar,
            tooltip: appSettings.progressMarkersVisible ? 'On' : 'Off',
            switch: appSettings.progressMarkersVisible,
            onSwitch: async function (item) {
              const ns = !item.switch;
              appSettings.progressMarkersVisible = ns;
              saveSettings(appSettings);
              item.tooltip = ns ? 'On' : 'Off';
              mountProgressMarkers();
              return ns;
            },
          },
        ];
      }

      async function buildArtplayer(streamUrl, watchData) {
        unmountPlayer();
        const container = document.getElementById('artplayer-app');
        container.innerHTML = '';
        const badge = document.createElement('div');
        badge.className = 'mode-badge player';
        badge.id = 'modeBadge';
        badge.textContent = 'PLAYER MODE';
        container.appendChild(badge);

        skipFired = { op: false, ed: false };
        hlsRecoveryAttempts = 0;

        const s0 = (watchData?.streams && watchData.streams[0]) || {};
        const subs = s0.subtitles || watchData?.subtitles || [];
        log(`[Subs] ${subs.length} track(s)`, '#00ffcc');

        const chosenSub = subs.find((s) => s.default) || subs[0] || null;
        const defaultSubUrl = chosenSub ? proxySubtitle(chosenSub.url) : '';
        const defaultSubType = chosenSub ? detectSubtitleType(chosenSub) : null;
        const defaultSubName = chosenSub?.language || 'English';

        let wasmBlobUrl = null;
        let workerBlobUrl = null;
        try {
          wasmBlobUrl = await fetchAsBlobUrl(
            proxyReanimeStatic('subtitles-octopus-worker.wasm'),
            { expectWasm: true, mimeType: 'application/wasm' }
          );
        } catch (err) {
          log(`[WASM] ${escapeHtml(err.message)}`, 'orange');
        }
        try {
          const workerResp = await fetch(
            proxyReanimeStatic('subtitles-octopus-worker.js?v=1')
          );
          if (!workerResp.ok) throw new Error(`HTTP ${workerResp.status}`);
          let workerText = await workerResp.text();
          if (wasmBlobUrl) {
            workerText = workerText
              .replace(/"subtitles-octopus-worker\.wasm"/g, `"${wasmBlobUrl}"`)
              .replace(/'subtitles-octopus-worker\.wasm'/g, `'${wasmBlobUrl}'`)
              .replace(/subtitles-octopus-worker\.wasm/g, wasmBlobUrl);
          }
          workerBlobUrl = URL.createObjectURL(
            new Blob([workerText], { type: 'application/javascript' })
          );
        } catch (err) {
          log(`[Worker] ${escapeHtml(err.message)}`, 'orange');
        }

        return new Promise((resolve) => {
          art = new Artplayer({
            container: '#artplayer-app',
            url: streamUrl,
            type: 'm3u8',
            autoplay: true,
            muted: false,
            volume: 1,
            setting: true,
            settings: buildSettingsMenu(),
            playbackRate: true,
            aspectRatio: true,
            fullscreen: true,
            fullscreenWeb: true,
            pip: true,
            screenshot: true,
            hotkey: true,
            theme: '#6200ee',
            lang: 'en',
            moreVideoAttr: { crossOrigin: 'anonymous' },
            subtitle: defaultSubUrl
              ? {
                  url: defaultSubUrl,
                  type: defaultSubType === 'ass' ? 'ass' : 'vtt',
                  name: defaultSubName,
                  escape: false,
                }
              : undefined,
            customType: {
              m3u8: function (video, url, art) {
                if (Hls.isSupported()) {
                  if (hlsInstance) hlsInstance.destroy();
                  hlsInstance = new Hls({
                    enableWorker: true,
                    fragLoadingMaxRetry: 8,
                    manifestLoadingMaxRetry: 4,
                    levelLoadingMaxRetry: 4,
                  });
                  art.hls = hlsInstance;
                  hlsInstance.loadSource(url);
                  hlsInstance.attachMedia(video);
                  hlsInstance.on(Hls.Events.MANIFEST_PARSED, (e, data) =>
                    log(
                      `[HLS] Levels: ${data.levels.length}, audio: ${
                        data.audioTracks?.length || 0
                      }`,
                      '#00ffcc'
                    )
                  );
                  hlsInstance.on(Hls.Events.ERROR, (e, data) => {
                    if (!data.fatal) return;
                    log(
                      `[HLS ERROR] FATAL ${data.type} / ${data.details}`,
                      'red'
                    );
                    hlsRecoveryAttempts++;
                    if (hlsRecoveryAttempts > HLS_MAX_RECOVERY_ATTEMPTS) {
                      log(`[HLS] Recovery exhausted — fallback`, '#f59e0b');
                      switchToIframe(`HLS ${data.type}/${data.details}`);
                      return;
                    }
                    log(
                      `[HLS] Recovery ${hlsRecoveryAttempts}/${HLS_MAX_RECOVERY_ATTEMPTS}`,
                      '#f59e0b'
                    );
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR)
                      hlsInstance.startLoad();
                    else if (data.type === Hls.ErrorTypes.MEDIA_ERROR)
                      hlsInstance.recoverMediaError();
                    else switchToIframe(`HLS ${data.type}/${data.details}`);
                  });
                  art.on('destroy', () => {
                    try {
                      hlsInstance.destroy();
                    } catch {}
                    hlsInstance = null;
                  });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                  video.src = url;
                }
              },
            },
            controls: [
              {
                name: 'subtitle',
                position: 'right',
                html: 'CC',
                tooltip: 'Subtitles',
                selector: buildSubtitleSelector(subs),
                onSelect: function (item) {
                  loadSubtitle(item);
                  return item.html;
                },
              },
            ],
            plugins: [
              artplayerPluginLibass({
                fallbackFont: FALLBACK_FONT_URL,
                workerUrl: workerBlobUrl,
                wasmUrl: wasmBlobUrl,
                legacyWorkerUrl: workerBlobUrl,
              }),
            ],
          });

          art.on('artplayerPluginLibass:init', () =>
            log(`[Plugin] libass init done`, '#00ffcc')
          );
          art.on('ready', () => {
            log(`[Artplayer] Ready`, '#00ffcc');
            mountSkipButton();
            art.on('video:timeupdate', updateSkipButton);
            setTimeout(resolve, 300);
          });
          art.on('video:loadedmetadata', () => {
            log(`[Artplayer] Duration: ${formatTime(art.duration)}`, '#00ffcc');
            mountProgressMarkers();
          });
          art.on('video:playing', () => {
            hlsRecoveryAttempts = 0;
            log(`[Player] Playing`, '#00ffcc');
          });
        });
      }

      async function runPipeline() {
        const anilistId = document.getElementById('anilistInput').value.trim();
        const provider = document.getElementById('providerSelect').value;
        const info = document.getElementById('streamInfo');
        if (!anilistId) return;

        currentSkipIntervals = { op: null, ed: null };
        skipFired = { op: false, ed: false };
        hlsRecoveryAttempts = 0;
        lastWatchData = null;
        unmountPlayer();
        const container = document.getElementById('artplayer-app');
        container.innerHTML = '';
        const badge = document.createElement('div');
        badge.className = 'mode-badge player';
        badge.id = 'modeBadge';
        badge.textContent = 'PLAYER MODE';
        container.appendChild(badge);
        currentMode = 'player';

        listDiv.innerHTML = '';
        info.innerText = '';

        try {
          log(
            `Step 1: Fetching episodes for ${anilistId} on [<b>${provider}</b>]`,
            '#00ffcc'
          );
          const epRes = await fetch(
            `${API_BASE}/episodes/${provider}/${anilistId}`
          );
          const rawText = await epRes.text();
          if (rawText.trim().startsWith('<'))
            throw new Error('Server returned HTML');
          const epData = JSON.parse(rawText);
          const providerData = epData[provider];
          if (!providerData || providerData.error)
            throw new Error(providerData?.error || 'Provider data unavailable');

          const subEpisodes = providerData.episodes?.sub || [];
          if (!subEpisodes.length) throw new Error('No sub episodes');
          const epIdentifier = subEpisodes[0].id.split('/').pop();

          log(`Step 2: Resolving watch stream`, '#00ffcc');
          const watchRes = await fetch(
            `${API_BASE}/watch/${provider}/${anilistId}/sub/${epIdentifier}`
          );
          const watchRaw = await watchRes.text();
          if (watchRaw.trim().startsWith('<'))
            throw new Error('Watch returned HTML');
          const watchData = JSON.parse(watchRaw);
          lastWatchData = watchData;

          // Payload inspection
          const s0 = watchData.streams?.[0] || {};
          log(
            `[Payload] streams=${watchData.streams?.length || 0} | embeds=${
              watchData.embeds?.length || 0
            }`,
            '#aaa'
          );
          log(
            `[Payload] s0.intro=${s0.intro ? 'obj' : 'null'} | s0.outro=${
              s0.outro ? 'obj' : 'null'
            }`,
            '#aaa'
          );
          log(
            `[Payload] top intro=${
              watchData.intro ? 'obj' : 'null'
            } | intro_start=${watchData.intro_start ?? 'null'} | intro_end=${
              watchData.intro_end ?? 'null'
            }`,
            '#aaa'
          );
          log(
            `[Payload] top outro=${
              watchData.outro ? 'obj' : 'null'
            } | outro_start=${watchData.outro_start ?? 'null'} | outro_end=${
              watchData.outro_end ?? 'null'
            }`,
            '#aaa'
          );

          log(`Step 3: Resolving intro/outro`, '#00ffcc');
          const skip = await resolveSkipIntervals(anilistId, 1, watchData);
          if (skip) {
            currentSkipIntervals = { op: skip.op, ed: skip.ed };
            log(`[Resolve] <b>source: ${skip.source}</b>`, '#00ffcc');
          } else {
            log(`[Resolve] No skip data from any source.`, 'orange');
          }

          const rawStreamUrl =
            watchData.stream_url ||
            watchData.url ||
            watchData.streams?.[0]?.url ||
            '';
          const playlistKey =
            watchData.playlist_key ||
            watchData.streams?.[0]?.playlist_key ||
            '';
          if (!rawStreamUrl) {
            log(`[Pipeline] No stream URL — fallback directly`, '#f59e0b');
            await switchToIframe('no stream URL');
            return;
          }

          const streamUrl = `${API_BASE}/proxy/flix-stream?url=${encodeURIComponent(
            rawStreamUrl
          )}&key=${encodeURIComponent(playlistKey)}`;
          info.innerText = `Playing via ${provider}`;
          log(`Step 4: Building Artplayer`, '#00ffcc');
          await buildArtplayer(streamUrl, watchData);
        } catch (err) {
          log(`Error: ${escapeHtml(err.message)}`, 'red');
          console.error(err);
        }
      }
    </script>
  </body>
