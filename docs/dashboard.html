<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Cloud Hub</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>

  <div id="ch-header-mount"></div>

  <main class="dashboard-main">
    <div class="ch-container">
      
      <header class="dashboard-hero">
        <div class="dashboard-hero__profile">
          <div class="dashboard-avatar" id="dashAvatar"></div>
          <div class="dashboard-hero__text">
            <h1 class="dashboard-title" id="dashUsername">Loading…</h1>
            <p class="dashboard-sub" id="dashDisplayName">Welcome back</p>
          </div>
        </div>
        <div class="dashboard-actions">
          <a href="/user/settings" class="ch-btn ch-btn--quiet">Edit Profile</a>
          <a href="#" class="ch-btn ch-btn--primary" id="dashPublicProfileLink">View Public Profile</a>
        </div>
      </header>

      <!-- High-Tech Stats Grid -->
      <section class="dashboard-analytics">
        
        <!-- Pie Chart -->
        <div class="dash-chart-card">
          <h3 class="dash-chart-title">Watchlist Breakdown</h3>
          <div class="dash-pie-wrap">
            <div class="dash-pie" id="dashPieChart"></div>
            <div class="dash-legend">
              <div class="dash-legend-item"><span class="dot dot-red"></span> Watching</div>
              <div class="dash-legend-item"><span class="dot dot-green"></span> Completed</div>
              <div class="dash-legend-item"><span class="dot dot-blue"></span> Planned</div>
              <div class="dash-legend-item"><span class="dot dot-gray"></span> Dropped</div>
            </div>
          </div>
        </div>

        <!-- Podium Graph -->
        <div class="dash-chart-card">
          <h3 class="dash-chart-title">Top Stats</h3>
          <div class="dash-podium" id="dashPodium">
            <!-- Injected by JS -->
          </div>
        </div>

        <!-- Circular Progress -->
        <div class="dash-chart-card">
          <h3 class="dash-chart-title">Completion Rate</h3>
          <div class="dash-ring-wrap">
            <svg class="dash-ring" viewBox="0 0 100 100">
              <circle class="dash-ring-bg" cx="50" cy="50" r="40"/>
              <circle class="dash-ring-fill" cx="50" cy="50" r="40" id="dashRingFill"/>
            </svg>
            <div class="dash-ring-text" id="dashRingText">0%</div>
          </div>
        </div>

      </section>

      <!-- Continue Watching -->
      <section class="dashboard-section" id="dashContinueSection" hidden>
        <header class="ch-section-head" style="margin-bottom: var(--s-4);">
          <h2 class="ch-section-title">Continue Watching</h2>
        </header>
        <div class="dashboard-row" id="dashContinueRow"></div>
      </section>

      <div class="dashboard-tabs" id="dashTabs">
        <button class="dashboard-tab is-active" data-tab="watching">Watching</button>
        <button class="dashboard-tab" data-tab="completed">Completed</button>
        <button class="dashboard-tab" data-tab="plan">Plan to Watch</button>
        <button class="dashboard-tab" data-tab="dropped">Dropped</button>
      </div>

      <div class="dashboard-content" id="dashContent">
        <div class="dashboard-loading">Loading your list…</div>
      </div>

    </div>
  </main>

  <div id="ch-footer-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="/shared.js"></script>
  <script src="/auth.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
