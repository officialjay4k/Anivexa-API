<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile — Cloud Hub</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/profile.css">
</head>
<body>

  <div id="ch-header-mount"></div>

  <main class="profile-main" id="profileMain" hidden>
    
    <!-- Hero / Banner -->
    <div class="profile-hero">
      <div class="profile-hero__bg" id="profileBg"></div>
      <div class="profile-hero__scrim"></div>
    </div>

    <div class="ch-container profile-layout">
      
      <!-- Left Column: Avatar & Identity -->
      <aside class="profile-sidebar">
        <div class="profile-card">
          <div class="profile-avatar-wrap">
            <div class="profile-avatar" id="profileAvatar"></div>
          </div>
          
          <h1 class="profile-name" id="profileDisplayName">Display Name</h1>
          <div class="profile-handle" id="profileUsername">@username</div>
          <div class="profile-id" id="profileId">#000</div>
          
          <div class="profile-tier" id="profileTier">
            <span class="profile-tier__badge">Chunin</span>
          </div>

          <p class="profile-bio" id="profileBio">No bio set.</p>
          
          <div class="profile-meta">
            <div class="profile-meta__row">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span id="profileJoinDate">Joined 2026</span>
            </div>
          </div>

          <div class="profile-actions">
            <button type="button" class="ch-btn ch-btn--primary" style="width:100%" disabled>Add Friend (Coming Soon)</button>
          </div>
        </div>
      </aside>

      <!-- Right Column: Stats & Watchlist -->
      <div class="profile-content">
        
        <!-- Stats -->
        <section class="profile-section" id="statsSection">
          <header class="profile-section__head">
            <h2 class="profile-section__title">Statistics</h2>
          </header>
          <div class="profile-stats-grid" id="profileStatsGrid">
            <!-- Injected by JS -->
          </div>
        </section>

        <!-- Watchlist Sections -->
        <section class="profile-section">
          <header class="profile-section__head">
            <h2 class="profile-section__title">Anime List</h2>
          </header>
          
          <div class="profile-watchlist" id="profileWatchlist">
            <div class="profile-wl-empty">This user's watchlist is private or empty.</div>
          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- Loading State -->
  <div class="ch-container" id="profileLoading" style="padding-top: 120px; text-align: center;">
    <div class="ch-page-loader__mark" style="margin: 0 auto 16px;">
      <svg viewBox="0 0 80 48" aria-hidden="true" style="width:72px;height:48px;">
        <path d="M 22 42 C 12 42 6 34 12 27 C 10 18 22 10 32 15 C 36 4 54 4 58 15 C 68 16 72 27 64 34 C 66 40 60 42 54 42 Z" fill="currentColor"/>
      </svg>
    </div>
    <h2 style="color:var(--ch-red-bright); font-size: 16px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;">Loading Profile…</h2>
  </div>

  <!-- Error State (Not Found) -->
  <div class="ch-container" id="profileNotFound" hidden style="padding-top: 120px; text-align: center;">
    <h2 style="color: #fff; font-size: 24px; font-weight: 900; margin-bottom: 8px;">User not found</h2>
    <p style="color: var(--ch-fg-muted); margin-bottom: 24px;">The profile you're looking for doesn't exist or has been deleted.</p>
    <a href="/home" class="ch-btn ch-btn--primary">Return Home</a>
  </div>

  <div id="ch-footer-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="/shared.js"></script>
  <script src="/auth.js"></script>
  <script src="/profile.js"></script>
</body>
</html>
