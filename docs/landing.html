<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Hub — Watch Free Anime Online</title>
  <link rel="icon" type="image/png" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/landing.css">
</head>
<body class="landing-body">

  <div class="landing-bg" id="landingBg" aria-hidden="true"></div>
  <div class="landing-bg-overlay" aria-hidden="true"></div>

  <div class="ch-motif-strip landing-motif-top" aria-hidden="true"></div>

  <main class="landing-main">
    <div class="landing-hero">

      <a href="/" class="landing-logo" aria-label="Cloud Hub home">
        <img src="/logo.png" alt="Cloud Hub">
      </a>

      <h1 class="landing-tagline">
        Watch <span class="text-red">free anime</span> online
      </h1>

      <p class="landing-sub">
        Thousands of titles. Fast streams. No clutter. No signup.
      </p>

      <form class="landing-search" id="landingSearch" autocomplete="off">
        <div class="ch-search">
          <span class="ch-search__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input type="text" id="landingSearchInput"
                 placeholder="Search anime..." aria-label="Search anime">
        </div>
        <button type="submit" class="ch-btn ch-btn--primary">Filter</button>
      </form>

      <div class="landing-suggestions" id="landingSuggestions">
        <span class="landing-suggestions__label">Try:</span>
      </div>

      <div class="landing-cta">
        <a href="/home" class="ch-btn ch-btn--primary ch-btn--lg">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 4 20 12 6 20"></polygon>
          </svg>
          Watch Now
        </a>
        <a href="/home#schedule" class="ch-btn ch-btn--cream ch-btn--lg">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <line x1="8" y1="3" x2="8" y2="7"></line>
            <line x1="16" y1="3" x2="16" y2="7"></line>
          </svg>
          View Schedule
        </a>
      </div>

      <div class="landing-badges">
        <div class="landing-badge">
          <div class="landing-badge__icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="12 2 15 9 22 9.5 17 14 18.5 21 12 17.5 5.5 21 7 14 2 9.5 9 9"></polygon>
            </svg>
          </div>
          <div class="landing-badge__body">
            <div class="landing-badge__title">#1 Streaming</div>
            <div class="landing-badge__sub">Ranked by users</div>
          </div>
        </div>

        <div class="landing-badge">
          <div class="landing-badge__icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10"></polygon>
            </svg>
          </div>
          <div class="landing-badge__body">
            <div class="landing-badge__title">Fast Streams</div>
            <div class="landing-badge__sub">Zero buffering</div>
          </div>
        </div>

        <div class="landing-badge">
          <div class="landing-badge__icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M8 14 C 8 17 16 17 16 14"></path>
              <line x1="9" y1="9" x2="9.01" y2="9"></line>
              <line x1="15" y1="9" x2="15.01" y2="9"></line>
            </svg>
          </div>
          <div class="landing-badge__body">
            <div class="landing-badge__title">User Friendly</div>
            <div class="landing-badge__sub">Built for fans</div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div class="ch-motif-strip landing-motif-bottom" aria-hidden="true"></div>

  <script src="/landing.js"></script>
</body>
</html>
