<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — Cloud Hub</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/auth.css">
</head>
<body class="auth-body">

  <a href="/" class="auth-logo">
    <img src="/logo.png" alt="Cloud Hub">
  </a>

  <div class="auth-shell">
    <div class="auth-card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to keep watching where you left off.</p>

      <form class="auth-form" id="loginForm" autocomplete="on">
        <label class="auth-field">
          <span>Email</span>
          <input type="email" id="emailInput" required autocomplete="email" placeholder="you@example.com">
        </label>

        <label class="auth-field">
          <span>Password</span>
          <input type="password" id="passwordInput" required autocomplete="current-password">
        </label>

        <div class="auth-error" id="authError" hidden></div>
        <div class="auth-success" id="authSuccess" hidden></div>

        <button type="submit" class="ch-btn ch-btn--primary ch-btn--lg auth-submit" id="loginBtn">Sign in</button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <button type="button" class="auth-google" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <p class="auth-alt">
        New here? <a href="/auth/signup">Create an account</a>
      </p>
    </div>
  </div>

  <div class="auth-motif-bottom ch-motif-strip" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="/shared.js"></script>
  <script src="/auth.js"></script>
  <script src="/login.js"></script>
</body>
</html>
