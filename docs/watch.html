<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Hub — Watch</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/watch.css">
</head>
<body>

  <div id="ch-header-mount"></div>

  <main class="watch-main">
    <div class="ch-container">

      <div class="watch-banner" id="watchBanner">
        <div class="watch-banner__icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16.5" r="1" fill="currentColor" stroke="none"/></svg>
        </div>
        <div class="watch-banner__text">
          If the episode isn't working, please report it — we'll fix it as soon as possible.
        </div>
        <button type="button" class="watch-banner__btn" id="watchBannerReport">Report</button>
      </div>

      <div class="watch-top">
        <div class="watch-top__player">
          <div class="watch-player-wrap">
            <div class="watch-player" id="watchPlayer">
              <div class="watch-player__skeleton" id="watchPlayerSkeleton"></div>
            </div>
            <div class="watch-player-badge" id="watchBadge">Loading…</div>
          </div>

          <div class="watch-controls" id="watchControls">
            <button class="watch-toggle watch-toggle--accent" id="btnAutoSkip" type="button">
              <span class="watch-toggle__dot"></span><span>Auto Skip</span>
            </button>
            <button class="watch-toggle watch-toggle--accent" id="btnAutoNext" type="button">
              <span class="watch-toggle__dot"></span><span>Auto Next</span>
            </button>
            <button class="watch-toggle watch-toggle--accent" id="btnAutoPlay" type="button">
              <span class="watch-toggle__dot"></span><span>Auto Play</span>
            </button>
            <span class="watch-controls__sep"></span>
            <button class="watch-toggle watch-toggle--lang" id="btnSub" type="button" data-lang="sub">Sub</button>
            <button class="watch-toggle watch-toggle--lang" id="btnDub" type="button" data-lang="dub">Dub</button>
            <span class="watch-controls__sep"></span>
            <button class="watch-toggle watch-toggle--failover" id="btnFailover" type="button" title="Skip current source and try the next">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
              Skip Source
            </button>
          </div>

          <div class="watch-servers" id="watchServers">
            <div class="watch-servers__loading">
              <span class="ch-skel ch-skel-line" style="width:220px;display:inline-block"></span>
            </div>
          </div>
        </div>

        <aside class="watch-top__episodes">
          <div class="watch-ep-head">
            <h3 class="watch-ep-title">Episodes</h3>
            <span class="watch-ep-count" id="watchEpCount">—</span>
          </div>
          <div class="watch-ep-body" id="watchEpList">
            <div class="watch-ep-loading">
              <div class="ch-skel ch-skel-line" style="width:60%"></div>
              <div class="ch-skel ch-skel-line" style="width:40%; margin-top:8px;"></div>
              <div class="ch-skel ch-skel-line" style="width:55%; margin-top:8px;"></div>
            </div>
          </div>
        </aside>
      </div>

      <section class="watch-info">
        <div class="watch-info__head">
          <h1 class="watch-title" id="watchTitle">Loading…</h1>
          <div class="watch-watching" id="watchWatching" hidden>
            <span class="watch-watching__dot"></span>
            <span class="watch-watching__num">—</span>
            <span class="watch-watching__label">watching</span>
          </div>
        </div>
        <div class="watch-meta" id="watchMeta"></div>
        <div class="watch-actions">
          <a href="#" class="ch-btn ch-btn--quiet ch-btn--sm" id="watchPreviewLink">View Details</a>
          <button class="ch-btn ch-btn--ghost ch-btn--sm" id="watchWatchlistBtn" type="button">Add to List</button>
        </div>
      </section>

      <section class="watch-countdown" id="watchCountdown" hidden>
        <div class="watch-countdown__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 15 14"/>
          </svg>
        </div>
        <div class="watch-countdown__body">
          <div class="watch-countdown__label">Next episode airs</div>
          <div class="watch-countdown__date" id="watchCountdownDate">—</div>
        </div>
        <div class="watch-countdown__timer" id="watchCountdownTimer">—</div>
      </section>

      <div class="watch-bottom">
        <div class="watch-bottom__main">
          <section class="watch-comments">
            <header class="watch-comments__head">
              <h3 class="watch-comments__title">Comments</h3>
              <span class="watch-comments__count">0</span>
            </header>
            <div class="watch-comments__empty">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
              <p>Comments are coming soon.</p>
              <span>Sign in to be notified when they launch.</span>
            </div>
          </section>
        </div>

        <aside class="watch-bottom__similar">
          <div class="watch-similar-head">
            <h3 class="watch-similar-title">Similar Anime</h3>
          </div>
          <div class="watch-similar-list" id="watchSimilarList">
            <div class="watch-similar-skel">
              <div class="ch-skel" style="width:60px; height:90px;"></div>
              <div style="flex:1;">
                <div class="ch-skel ch-skel-line" style="width:80%"></div>
                <div class="ch-skel ch-skel-line" style="width:50%; margin-top:8px;"></div>
              </div>
            </div>
            <div class="watch-similar-skel">
              <div class="ch-skel" style="width:60px; height:90px;"></div>
              <div style="flex:1;">
                <div class="ch-skel ch-skel-line" style="width:70%"></div>
                <div class="ch-skel ch-skel-line" style="width:40%; margin-top:8px;"></div>
              </div>
            </div>
          </div>
        </aside>
      </div>

    </div>
  </main>

  <div id="ch-footer-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.7/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/artplayer@5.4.0/dist/artplayer.js"></script>
  <script src="https://flixcloud.cc/artplayer-new/artplayer-plugin-libass.legacy.js?v=104"></script>

  <script src="/tmdb.js"></script>
  <script src="/shared.js"></script>
  <script src="/progress.js"></script>
  <script src="/subtitles.js"></script>
  <script src="/pipeline.js"></script>
  <script src="/player.js"></script>
  <script src="/watch.js"></script>
</body>
</html>
