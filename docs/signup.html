<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up — Cloud Hub</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/auth.css">
</head>
<body class="auth-body">

  <a href="/" class="auth-logo">
    <img src="/logo.png" alt="Cloud Hub">
  </a>

  <div class="auth-shell">
    <div class="auth-card">
      <h1 class="auth-title">Create account</h1>
      <p class="auth-sub">Join Cloud Hub — track your shows, keep your progress, and share your stats.</p>

      <form class="auth-form" id="signupForm" autocomplete="on">
        <label class="auth-field">
          <span>Email</span>
          <input type="email" id="emailInput" required autocomplete="email" placeholder="you@example.com">
        </label>

        <label class="auth-field">
          <span>Username</span>
          <div class="auth-field__row">
            <input type="text" id="usernameInput" required minlength="3" maxlength="20" autocomplete="username" placeholder="coolname">
            <span class="auth-field__status" id="usernameStatus"></span>
          </div>
          <span class="auth-field__hint">3–20 characters. Letters, numbers, underscores.</span>
        </label>

        <label class="auth-field">
          <span>Password</span>
          <input type="password" id="passwordInput" required minlength="6" autocomplete="new-password" placeholder="Min. 6 characters">
        </label>

        <label class="auth-field">
          <span>Confirm password</span>
          <input type="password" id="passwordConfirmInput" required minlength="6" autocomplete="new-password">
        </label>

        <div class="auth-error" id="authError" hidden></div>

        <button type="submit" class="ch-btn ch-btn--primary ch-btn--lg auth-submit" id="signupBtn">Create account</button>
      </form>

      <p class="auth-alt">
        Already have an account? <a href="/auth/login">Sign in</a>
      </p>
    </div>
  </div>

  <div class="auth-motif-bottom ch-motif-strip" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script src="/supabase-config.js"></script>
  <script src="/shared.js"></script>
  <script src="/auth.js"></script>
  <script src="/signup.js"></script>
</body>
</html>
